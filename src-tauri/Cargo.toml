[package]
name = "pronto"
version = "0.8.2"
description = "Windows-first push-to-talk dictation"
edition = "2021"

[lib]
name = "pronto_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1.2"

[dependencies]
cpal = "0.18.2"
keyring = "2.3.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSImage", "NSScreen"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSString"] }
core-foundation = "0.10.1"
core-graphics = "0.25.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.3.4"
image = { version = "0.25.8", default-features = false, features = ["tiff"] }
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
mach2 = "0.6"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
strip = true
