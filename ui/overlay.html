<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pronto dictation</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <section id="meeting-prompt" class="meeting-prompt" aria-live="polite" hidden>
      <div id="meeting-idle">
        <strong id="meeting-prompt-title">Take notes for this meeting?</strong>
        <span id="meeting-prompt-desc">Your microphone and computer audio will be saved locally.</span>
        <div class="meeting-prompt-actions">
          <button id="meeting-start" type="button">Start meeting notes</button>
          <button id="meeting-dismiss" type="button">Not now</button>
        </div>
      </div>

    </section>
    <div id="microphone-label" class="microphone-label" hidden></div>
    <section id="meeting-pill" class="meeting-pill" aria-live="polite" hidden>
      <span class="meeting-pill-icon" id="meeting-pill-icon" aria-hidden="true"><canvas id="meeting-pill-canvas" width="20" height="20"></canvas></span>
      <span class="meeting-pill-title" id="meeting-pill-title">A meeting was detected</span>
      <button id="meeting-pill-start" type="button">Start taking notes</button>
      <button id="meeting-pill-dismiss" type="button" aria-label="Dismiss" title="Dismiss"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </section>
    <div id="overlay-row">
      <main id="dictation-pill" aria-label="Pronto dictation controls">
        <button id="cancel" aria-label="Cancel dictation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="signal" aria-label="Listening"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <button id="finish" aria-label="Finish dictation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5 10 18 19.5 6.5"/></svg></button>
      </main>
      <button id="notetaker-open" aria-label="Take meeting notes" title="Take meeting notes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="record-ring" cx="12" cy="12" r="7.5"/><circle class="record-dot" cx="12" cy="12" r="3.2"/></svg></button>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
