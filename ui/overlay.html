<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pronto dictation</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <section id="meeting-prompt" class="meeting-prompt" aria-live="polite" hidden>
      <strong>Take notes for this meeting?</strong>
      <span>Your microphone and computer audio will be saved locally.</span>
    </section>
    <div id="microphone-label" class="microphone-label" hidden></div>
    <main aria-label="Pronto dictation controls">
      <div class="signal" aria-label="Listening"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span id="meeting-time" class="meeting-time" hidden>00:00</span>
      <button id="meeting-record" class="meeting-record" aria-label="Start meeting notes" title="Start meeting notes"><span></span></button>
    </main>
    <script src="overlay.js"></script>
  </body>
</html>
