<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pronto</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="tray.css" />
  </head>
  <body>
    <div class="tray-layer">
      <section class="tray-panel" id="panel">
        <header class="tray-head">
          <span class="tray-head-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
          </span>
          <span class="tray-head-name">Pronto</span>
          <span class="tray-head-state" id="engine-state" title=""><i></i><span id="engine-state-text"></span></span>
        </header>
        <div class="tray-list" id="list" role="menu" aria-label="Pronto"></div>
      </section>

      <section class="tray-flyout" id="flyout" aria-label="Transcript history" hidden>
        <header class="tray-flyout-head">
          <span class="tray-flyout-title">Transcript history</span>
          <span class="tray-flyout-count" id="flyout-count"></span>
        </header>
        <div class="tray-flyout-list" id="flyout-list" role="menu" aria-label="Recent transcripts"></div>
        <div class="tray-flyout-foot">
          <button type="button" class="tray-foot-button" data-action="open-history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" /><path d="M7.5 10h9M7.5 14h6" /></svg>
            Open History
          </button>
          <button type="button" class="tray-foot-button" data-action="open-settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6" /></svg>
            Settings
          </button>
        </div>
      </section>
    </div>
    <script src="theme.js"></script>
    <script src="tray.js"></script>
  </body>
</html>
