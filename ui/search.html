<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronto Search</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://icons.duckduckgo.com" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="pill-chrome.css" />
  <link rel="stylesheet" href="search.css" />
</head>
<body class="mode-idle">
  <div id="backdrop" class="search-backdrop" hidden></div>

  <div id="chrome" class="search-chrome" aria-label="Pronto voice search" hidden>
    <button type="button" id="search-cancel" class="chrome-btn" aria-label="Cancel search" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="signal" class="signal" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
      <i></i><i></i><i></i><i></i>
    </div>
    <button type="button" id="search-submit" class="chrome-btn finish" aria-label="Search now" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16.5 16.5 20 20"/></svg>
    </button>
  </div>

  <div id="panel-shell" class="search-panel-shell" hidden>
    <section id="panel" class="search-panel" aria-label="Search result">
      <header class="panel-header">
        <div class="panel-header-text">
          <p id="search-query-label" class="search-query-label" hidden></p>
          <span id="search-layout-badge" class="layout-badge" hidden></span>
        </div>
        <button type="button" id="panel-close" class="panel-close" aria-label="Close search">×</button>
      </header>

      <div id="search-status" class="panel-status" hidden>
        <span id="search-message"></span>
      </div>

      <main class="panel-content" id="search-content" tabindex="0">
        <div class="search-empty" id="search-empty">
          <h1>Ask out loud</h1>
          <p>Hold or toggle your search shortcut, then speak.</p>
        </div>
        <div class="search-nodes" id="search-nodes" hidden></div>
      </main>

      <footer class="panel-footer">
        <!-- DuckDuckGo logo links to duckduckgo.com search results; trademark of Duck Duck Go, Inc. -->
        <button type="button" id="ddg-brand" class="ddg-brand" disabled aria-label="Open this search on DuckDuckGo">
          <img class="ddg-logo" src="assets/duckduckgo-logo.png" width="24" height="24" alt="" decoding="async" />
          <span class="ddg-name">DuckDuckGo</span>
        </button>
        <span class="panel-footer-note">Results by DuckDuckGo · Answer by DeepSeek</span>
      </footer>

      <div class="toast" id="toast" role="status"></div>
    </section>
  </div>

  <div id="peek" class="search-peek" hidden>
    <button type="button" id="peek-restore" class="peek-restore" aria-label="Restore search result">
      <svg class="peek-folder" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span id="peek-label" class="peek-label"></span>
    </button>
    <button type="button" id="peek-close" class="peek-close" aria-label="Dismiss search result">×</button>
  </div>

  <script src="theme.js" defer></script>
  <script src="markdown.js" defer></script>
  <script src="search.js" defer></script>
</body>
</html>
