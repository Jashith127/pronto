<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronto Search</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor/uPlot.min.css" />
  <link rel="stylesheet" href="search.css" />
</head>
<body class="search-body">
  <div class="search-shell">
    <header class="search-titlebar" data-tauri-drag-region>
      <div class="search-brand" data-tauri-drag-region>
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <strong>Pronto Search</strong>
      </div>
      <div class="window-actions">
        <button type="button" id="search-minimize" aria-label="Minimize">−</button>
        <button type="button" id="search-close" aria-label="Close">×</button>
      </div>
    </header>

    <div class="search-toolbar">
      <div class="search-phase" id="search-phase">Idle</div>
      <p class="search-message" id="search-message">Press Win + Space and speak your query.</p>
      <div class="search-actions">
        <button type="button" id="search-finish" hidden>Search now</button>
        <button type="button" class="change-button" id="search-cancel" hidden>Cancel</button>
      </div>
    </div>

    <div class="search-query" id="search-query" hidden>
      <span>Query</span>
      <strong id="search-query-text"></strong>
    </div>

    <main class="search-content" id="search-content" tabindex="0">
      <div class="search-empty" id="search-empty">
        <h1>Ask out loud</h1>
        <p id="search-empty-hint">Uses the same Hold / Toggle behavior as dictation. Default shortcut is <kbd>Win</kbd> + <kbd>Space</kbd>.</p>
        <p class="search-privacy">Your spoken query and result snippets are sent to DuckDuckGo and DeepSeek. Audio stays on this PC.</p>
      </div>
      <div class="search-nodes" id="search-nodes" hidden></div>
    </main>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script src="search.js"></script>
</body>
</html>
