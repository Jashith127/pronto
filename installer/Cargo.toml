[package]
name = "pronto-setup"
version = "0.9.0"
description = "Pronto Setup: installs Pronto and its speech model"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0.151"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
speech-packs = { path = "../crates/speech-packs" }
tauri = { version = "2.11.5", features = [] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
